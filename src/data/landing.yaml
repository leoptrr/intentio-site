# Copy da landing page do Intentio.
# Fonte: "Intentio - Landing page (copy e diretrizes)", Parte 1 (22/10/2026), enxugada em 22/10:
# sem valores de exemplo no texto (só o preço); os números aparecem só dentro das telas do app.
# Cada chave de topo é uma seção. Os números sobrescritos (¹ ² ³) viram links para as notas.
# Texto com [FALTA: …] precisa ser preenchido antes de publicar (o build avisa).
# screen: nome da captura em src/assets/screens/. Hoje vêm do protótipo v0.4 (dados de exemplo);
# trocar pelas capturas do build antes de publicar (diretriz 2.4).

meta:
  title: "Intentio · Saiba se a compra cabe no seu mês"
  description: "O app para iPhone que diz se a compra cabe no seu mês, antes de você pagar. R$ 14,90 por mês ou R$ 149 por ano."

nav:
  brand: "Intentio"
  links:
    - { label: "Como funciona", href: "#avaliar" }
    - { label: "Preço", href: "#preco" }
    - { label: "Perguntas", href: "#perguntas" }
  soon: "Em breve"
  download: "Baixar"

hero:
  words: ["Cabe.", "Espere.", "Não cabe."]
  subtitle: "O app para iPhone que diz se a compra cabe no seu mês, antes de você pagar."
  note: "Chega à App Store em janeiro de 2027. Para iPhone 11 ou mais novo.³"
  visual: "iPhone com o Intentio: na tela Hoje, a pessoa toca em Avaliar compra, digita o valor e vê o veredito: Espere, Cabe ou Não cabe"
  # Roteiro do iPhone no hero, em loop: a tela Hoje, toque em Avaliar compra, a folha sobe, o valor
  # aparece digitado, toque em Avaliar e o veredito, que acende a palavra da headline de mesmo índice
  # (word: 0 Cabe, 1 Espere, 2 Não cabe).
  # enter: como a tela entra (rise = folha subindo, fade, cut = sem transição); tap: toque [x, y] em %
  # da tela antes de sair dela (posições medidas no protótipo); hold: quanto tempo fica, em ms.
  # Sem movimento, fica a tela marcada com rest.
  sequence:
    - { alt: "Tela Hoje", screen: "hoje", enter: "fade", tap: [50, 40.8], hold: 1400 }
    - { alt: "Folha Avaliar compra vazia", screen: "seq-vazio", enter: "rise", tap: [53.9, 28.7], hold: 700 }
    - { alt: "Valor de R$ 389,90 digitado", screen: "seq-38990", enter: "cut", tap: [50, 74.4], hold: 900 }
    - { alt: "Veredito Espere: a compra usaria parte da reserva", screen: "veredito-espere", enter: "rise", word: 1, hold: 2600, rest: true }
    - { alt: "Folha Avaliar compra vazia", screen: "seq-vazio", enter: "fade", tap: [53.9, 28.7], hold: 600 }
    - { alt: "Valor de R$ 150 digitado", screen: "seq-150", enter: "cut", tap: [50, 74.4], hold: 900 }
    - { alt: "Veredito Cabe: sobra dinheiro em todos os dias", screen: "veredito-cabe", enter: "rise", word: 0, hold: 2600 }
    - { alt: "Folha Avaliar compra vazia", screen: "seq-vazio", enter: "fade", tap: [53.9, 28.7], hold: 600 }
    - { alt: "Valor de R$ 2.400 digitado", screen: "seq-2400", enter: "cut", tap: [50, 74.4], hold: 900 }
    - { alt: "Veredito Não cabe: nem a reserva cobre", screen: "veredito-nao-cabe", enter: "rise", word: 2, hold: 2600 }

avaliar:
  eyebrow: "Avaliar compra"
  title: "Uma pergunta antes de cada compra."
  subtitle: "Você digita o valor. O Intentio olha o seu mês dia a dia, até o próximo salário, e responde antes de você pagar."
  alt: "Avaliar compra no iPhone: o valor, os próximos meses e a resposta"
  steps:
    - title: "Digite o valor."
      text: "À vista ou parcelado."
      visual: "Folha Avaliar compra com o valor digitado"
      screen: "avaliar-valor"
    - title: "Ele olha os próximos meses."
      text: "Salário, contas fixas, parcelas, dívidas e o que você costuma gastar por dia entram na conta."
      visual: "Mês a mês com a compra, mostrando em que mês o saldo aperta"
      screen: "avaliar-meses"
    - title: "E responde."
      text: "Em uma palavra, com o motivo logo abaixo."
      visual: "Veredito Espere, com o motivo"
      screen: "veredito-espere"
  verdicts:
    - state: "positive"
      word: "Cabe"
      text: "Sobra dinheiro em todos os dias depois da compra."
    - state: "wait"
      word: "Espere"
      text: "A reserva cobre alguns dias no vermelho. Depois do próximo salário, a compra pode caber."
    - state: "negative"
      word: "Não cabe"
      text: "Nem a reserva cobre. Você vê em que mês falta e quanto."
  closing: "A decisão continua sua. Registre a compra assim mesmo, e os próximos meses se ajustam na hora."

quanto-cabe:
  eyebrow: "Quanto cabe"
  title: "Um número para o mês inteiro."
  subtitle: "Quanto você ainda pode gastar até o próximo salário, já sem a reserva e as contas que vão vencer."
  detail: "Toque em “Como chegamos nesse número” e a conta abre, linha por linha."
  visual: "Tela Hoje com o quanto cabe até o próximo salário e o valor por dia"
  screen: "hoje"

proximos-meses:
  eyebrow: "Próximos meses"
  title: "O ano inteiro, um dia de cada vez."
  subtitle: "O Intentio projeta o saldo de cada dia dos próximos 12 meses."
  alt: "Próximos meses no iPhone: a grade do ano, a comparação com a compra e a folga"
  steps:
    - title: "Cores com palavra"
      text: "Azul quando sobra, laranja quando a reserva entra, vermelho quando falta. A palavra vem sempre junto. O “Cabe” é azul, e não verde, para quem tem daltonismo."
      visual: "Grade dos próximos 12 meses com a legenda de cores"
      screen: "meses-grade"
    - title: "Com e sem a compra"
      text: "Compare o mês com e sem a compra, um ao lado do outro."
      visual: "Mês a mês com a opção Com a compra e Sem a compra"
      screen: "avaliar-meses"
    - title: "Folga"
      text: "Quando sobra, o Intentio mostra quanto dá para guardar a mais."
      visual: "Sugestão de quanto dá para guardar a mais por mês"
      screen: "meses-folga"

pagamentos:
  eyebrow: "Contas e parcelas"
  title: "Do jeito que o seu dinheiro sai."
  alt: "Parcelas, contas fixas, agendados e gasto do dia a dia no iPhone"
  steps:
    - title: "Parcelas"
      text: "Parcelou? Você escolhe o dia em que as parcelas caem, e cada uma entra no mês certo."
      visual: "Parcelamento com o valor de cada parcela, quantas faltam e o dia"
      screen: "parcelas"
    - title: "Contas fixas"
      text: "Aluguel, internet, luz e academia, cada uma no seu dia."
      visual: "Lista de contas fixas com o dia de cada uma"
      screen: "contas-fixas"
    - title: "Agendados"
      text: "Uma conta que ainda vai chegar já entra na projeção."
      visual: "Lançamentos com um agendado para uma data futura"
      screen: "lancamentos-agendados"
    - title: "Gasto do dia a dia"
      text: "Mercado e café também contam. O Intentio sugere quanto você costuma gastar por dia."
      visual: "Ajuste do gasto do dia a dia"
      screen: "gasto-dia"

lancamentos:
  eyebrow: "Lançamentos"
  title: "Semana, mês ou ano. Em um toque."
  subtitle: "Veja o que saiu e o que entrou em cada período."
  detail: "Apagou sem querer? Toque em Desfazer."
  visual: "Tela Lançamentos com o total do mês e a lista de gastos"
  screen: "lancamentos"

plano:
  eyebrow: "Plano"
  title: "Um caminho para sair do vermelho."
  subtitle: "Cadastre as dívidas e veja em que mês você fica livre, quanto vai pagar de juros e em que ordem pagar."
  detail: "Menor saldo ou maior juro: você escolhe a ordem e vê a diferença."
  closing: "O valor do plano já sai do quanto cabe."
  visual: "Tela Plano com o mês em que as dívidas terminam e a ordem de pagamento"
  screen: "plano"

privacidade:
  title: "Seus números ficam no seu iPhone."
  subtitle: "O Intentio guarda tudo no aparelho e no seu iCloud.¹ Você digita os valores, e o app não se conecta ao seu banco."
  items:
    - { title: "Sem conexão com banco.", text: "Você decide o que entra. Nenhuma senha de banco no app." }
    - { title: "iCloud.", text: "Seus dados no aparelho e na sua conta do iCloud.¹" }
    - { title: "Sem conta.", text: "Comece sem criar login." }
    - { title: "Modo escuro.", text: "Segue o ajuste do iPhone." }
    - { title: "Acessibilidade.", text: "VoiceOver, letra grande, Reduzir movimento e Reduzir transparência." }
    - { title: "Desfazer.", text: "Apagou um lançamento, uma conta ou uma dívida? Dá para voltar." }

comecar:
  title: "Três passos até o seu primeiro número."
  alt: "Os três passos da configuração no iPhone"
  steps:
    - title: "Quanto você recebe e em que dia."
      visual: "Passo 1: renda e dia do pagamento"
      screen: "setup-1"
    - title: "Suas contas fixas."
      text: "Sugestões prontas para tocar e ajustar."
      visual: "Passo 2: contas fixas, com sugestões para tocar"
      screen: "setup-2"
    - title: "Quanto guardar por mês."
      text: "5, 10 ou 15% da renda, ou o valor que você quiser."
      visual: "Passo 3: reserva mensal, com as opções de 5, 10 e 15%"
      screen: "setup-3"
  closing: "Seu mês começa assim."

preco:
  # Preços de 22/10/2026. [FALTA: teste grátis, sim ou não]. Se houver, entra aqui e nas perguntas.
  plans:
    - { name: "Mensal", value: "R$ 14,90", period: "por mês", note: "Menos de R$ 0,50 por dia." }
    - { name: "Anual", value: "R$ 149", period: "por ano", note: "O mesmo que 10 meses." }

perguntas:
  title: "Perguntas"
  items:
    - q: "Quando o Intentio chega?"
      a: "Em meados de janeiro de 2027, na App Store."
    - q: "Funciona em qual iPhone?"
      a: "Em qualquer iPhone com iOS 27: do iPhone 11 em diante, incluindo o iPhone SE de 2ª geração ou mais novo.³"
    - q: "Quanto custa?"
      a: "R$ 14,90 por mês, ou R$ 149 por ano (o mesmo que 10 meses)."
    - q: "O Intentio se conecta ao meu banco?"
      a: "Não. Você digita os valores, e o app nunca pede senha de banco."
    - q: "Onde ficam os meus dados?"
      a: "No seu iPhone e no seu iCloud.¹"
    - q: "Preciso criar conta?"
      a: "Não. Você começa direto, sem login."
    - q: "Ele diz se eu devo comprar?"
      a: "Ele mostra se a compra cabe e o número que explica. A decisão é sua, e o app não faz recomendação financeira.²"
    - q: "O que é a reserva?"
      a: "É o valor que você separa todo mês. O quanto cabe já desconta a reserva. A resposta Espere aparece quando a compra usaria parte dela."
    - q: "E se eu parcelar?"
      a: "Você escolhe o dia em que as parcelas caem, e o Intentio avalia todas elas, nos meses em que caem."
    - q: "Tem para Android?"
      a: "Por enquanto, só iPhone."

baixar:
  title: "Gaste de propósito."
  body: "Antes de comprar, saiba se cabe."

notas:
  items:
    - "A sincronização pelo iCloud depende de uma conta do iCloud ativa no iPhone."
    - "O Intentio faz cálculos a partir dos valores que você informa e não faz recomendação financeira."
    - "Requer iOS 27. Compatível com o iPhone 11 ou mais novo e com o iPhone SE (2ª geração ou mais novo)."
  examples: "As telas mostram dados fictícios."
  trademark: "Apple, o logotipo da Apple e iPhone são marcas comerciais da Apple Inc., registradas nos EUA e em outros países. App Store é uma marca de serviço da Apple Inc."
  legal: "[FALTA: links para a política de privacidade e os termos de uso]"
